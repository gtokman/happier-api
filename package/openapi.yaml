openapi: 3.1.0
info:
  title: Happier Grocery Commerce API (unofficial)
  version: 0.1.0
  summary: Reverse-engineered spec for ecom-api.getjaldi.com
  description: |
    Unofficial OpenAPI description of the Happier Grocery storefront API, derived
    from a Proxyman capture of the iOS app (`Happier/1 CFNetwork/3896.100.1.2.1`)
    on 2026-08-16. Not endorsed by or affiliated with Happier Grocery.

    ## Authentication

    Happier has **no login endpoint of its own**. Clients authenticate against
    Google Identity Platform (Firebase Auth) in multi-tenant mode and present the
    resulting ID token here. The iOS app runs Firebase SDK 10.29.0, which uses
    the *legacy* v3 `relyingparty` API on `www.googleapis.com`:

    ```http
    POST https://www.googleapis.com/identitytoolkit/v3/relyingparty/verifyPassword?key=AIza…
    x-ios-bundle-identifier: com.happier.mobile
    x-firebase-gmpid: 1:1025060920555:ios:bd9c0fa95303a4104a72ae
    content-type: application/json

    {"email":"…","password":"…","clientType":"CLIENT_TYPE_IOS",
     "tenantId":"happier-grocery-e8oja","returnSecureToken":true}
    ```

    - Google Cloud project: `upbeat-nova-376618`
    - Identity Platform tenant: `happier-grocery-e8oja`
    - Sign-in provider: `password`
    - The API key is restricted to bundle `com.happier.mobile`, so
      `x-ios-bundle-identifier` must be sent or Google answers `403`.
    - ID tokens live 3600s; refresh at `POST https://securetoken.googleapis.com/v1/token?key=…`
      with `grant_type=refresh_token` (form-encoded).

    The token is sent **raw, with no `Bearer` prefix**, in `x-vendora-authentication`.

    ## Non-REST surfaces

    Two endpoints here are not really REST and are described only loosely:

    - `POST /graphql` — full product detail and order detail.
    - `GET /trpc/{procedures}` — tRPC HTTP batch link. Procedure names are joined
      with commas in the path and `input` is a JSON object keyed by call index.

servers:
  - url: https://ecom-api.getjaldi.com

security:
  - vendoraAuth: []

tags:
  - name: business
  - name: products
  - name: checkout
  - name: orders
  - name: user
  - name: loyalty
  - name: analytics
  - name: graphql
  - name: trpc

components:
  securitySchemes:
    vendoraAuth:
      type: apiKey
      in: header
      name: x-vendora-authentication
      description: >-
        Firebase ID token from Identity Platform tenant `happier-grocery-e8oja`,
        sent raw (no `Bearer` prefix).

  parameters:
    BusinessHeader:
      name: business
      in: header
      required: true
      description: Business (tenant) id. Happier Grocery is `6499aa6a78f0258111803a89`.
      schema:
        type: string
        default: 6499aa6a78f0258111803a89
    LocationHeader:
      name: location
      in: header
      required: false
      description: Store location id, scoping catalog and pricing reads.
      schema:
        type: string
        default: 6499ba0478f0258111803da0
    OrderIdQuery:
      name: orderId
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/ObjectId"

  schemas:
    ObjectId:
      type: string
      pattern: "^[a-f0-9]{24}$"
      examples: ["6499aa6a78f0258111803a89"]

    OrderType:
      type: string
      enum: [PICKUP, DELIVERY, SHIPPING]

    StatusEnvelope:
      type: object
      description: Standard wrapper on most REST responses.
      properties:
        status: { type: boolean }
        message: { type: string }
      required: [status]

    Image:
      type: object
      properties:
        src: { type: string, format: uri }
        license: { type: [string, "null"] }
        origin: { type: [string, "null"] }
        blurhash: { type: [string, "null"] }
      required: [src]

    Product:
      type: object
      additionalProperties: true
      properties:
        _id: { $ref: "#/components/schemas/ObjectId" }
        name: { type: string }
        description: { type: string }
        price: { type: number }
        compareAt: { type: number }
        brand: { type: string }
        category: { type: string }
        subCategory: { type: string }
        size: { type: [number, string] }
        unitOfMeasure: { type: string }
        SKU: { type: string }
        PLU: { type: string }
        upcBarcode: { type: string }
        tags: { type: array, items: { type: string } }
        attributes: { type: array, items: { type: string } }
        images: { type: array, items: { $ref: "#/components/schemas/Image" } }
        active: { type: boolean }
        taxable: { type: boolean }
        ebtEligible: { type: boolean }
        containsAlcohol: { type: boolean }
        soldByWeight: { type: boolean }
      required: [_id, name, price]

    ProductInventory:
      type: object
      additionalProperties: true
      description: A product as stocked at one location. Cart line items reference this `_id`.
      properties:
        _id: { $ref: "#/components/schemas/ObjectId" }
        product: { $ref: "#/components/schemas/Product" }
        location: { $ref: "#/components/schemas/ObjectId" }
        price: { type: number }
        active: { type: boolean }
        inStock: { type: boolean }
        inStockQuantity: { type: integer }
        discount:
          type: object
          properties:
            hasDiscount: { type: boolean }
            discountedPrice: { type: number }
            labels: { type: array, items: { type: string } }
      required: [_id, product, price]

    Address:
      type: object
      properties:
        firstName: { type: string }
        lastName: { type: string }
        address1: { type: string }
        address2: { type: string }
        city: { type: string }
        state: { type: string }
        postalCode: { type: string }
        country: { type: string, default: US }
        phone: { type: string }
        email: { type: string, format: email }

    LineItem:
      type: object
      additionalProperties: true
      properties:
        id: { $ref: "#/components/schemas/ObjectId" }
        _id: { $ref: "#/components/schemas/ObjectId" }
        productID: { $ref: "#/components/schemas/ObjectId" }
        productInventoryID: { $ref: "#/components/schemas/ObjectId" }
        name: { type: string }
        price: { type: number }
        quantity: { type: integer }
        itemTotal: { type: number }
        images: { type: array, items: { $ref: "#/components/schemas/Image" } }
        modifiers: { type: array, items: {} }
      required: [id, _id, productID, productInventoryID, name, price, quantity]

    Checkout:
      type: object
      additionalProperties: true
      properties:
        _id: { $ref: "#/components/schemas/ObjectId" }
        business: { $ref: "#/components/schemas/ObjectId" }
        location: { $ref: "#/components/schemas/ObjectId" }
        status: { type: string, examples: ["created"] }
        orderType: { $ref: "#/components/schemas/OrderType" }
        tip: { type: number }
        sessionID: { type: string }
        lineItems: { type: array, items: { $ref: "#/components/schemas/LineItem" } }
        metadata: { type: object, additionalProperties: true }

    AnalyticsEvent:
      type: object
      properties:
        eventName:
          type: string
          examples: ["auth:sign_in", "cart:item_added", "catalog:product_viewed"]
        properties:
          type: object
          additionalProperties: true
          properties:
            platform: { type: string, examples: ["mobile"] }
      required: [eventName, properties]

    ProductCategory:
      type: object
      additionalProperties: true
      properties:
        _id: { $ref: "#/components/schemas/ObjectId" }
        name: { type: string, examples: ["Refrigerated"] }
        identifier:
          type: string
          description: Stable code used as `category` in searches.
          examples: ["DAIRY", "PRODUCE"]
        department: { type: string, examples: ["GROCERY"] }
        order: { type: integer }
        active: { type: boolean }
        allowsPickup: { type: boolean }
        allowsDelivery: { type: boolean }
        allowsShipping: { type: boolean }
        isBeverageBar: { type: boolean }
        banner: { type: [string, "null"] }
        icon: { type: [string, "null"] }
      required: [_id, name, identifier]

    ProductSubCategory:
      type: object
      additionalProperties: true
      properties:
        _id: { $ref: "#/components/schemas/ObjectId" }
        category: { $ref: "#/components/schemas/ObjectId" }
        name: { type: string, examples: ["Coffee"] }
        identifier:
          type: string
          description: Stable code used as `subCategory` in searches.
          examples: ["FRCOFFEE"]
        active: { type: boolean }
      required: [_id, category, name, identifier, active]

    CategoryProduct:
      type: object
      additionalProperties: true
      description: Trimmed inventory record used on category shelves.
      properties:
        id: { $ref: "#/components/schemas/ObjectId" }
        product: { $ref: "#/components/schemas/Product" }
        location: { $ref: "#/components/schemas/ObjectId" }
        price: { type: number }
        inStock: { type: boolean }
        active: { type: boolean }
        ranking: { type: number }
        soldByWeight: { type: boolean }
        allowsPickup: { type: boolean }
        allowsDelivery: { type: boolean }
        allowsShipping: { type: boolean }
      required: [id, product, price, inStock, active, location]

    Payment:
      type: object
      additionalProperties: true
      properties:
        _id: { $ref: "#/components/schemas/ObjectId" }
        checkout: { $ref: "#/components/schemas/ObjectId" }
        business: { $ref: "#/components/schemas/ObjectId" }
        location: { $ref: "#/components/schemas/ObjectId" }
        paymentType:
          type: string
          description: "`STRIPE` for app orders, `DATA_CAP` for in-store terminal sales."
          examples: [STRIPE, DATA_CAP]
        amount: { type: number, description: Settled amount }
        authorizedAmount:
          type: number
          description: Pre-auth amount for weighed / substitutable carts.
        status: { type: string, examples: [paid] }
        refundStatus: { type: string }
        amountRefunded: { type: number }
        externalServiceID:
          type: string
          description: Stripe PaymentIntent id, or the terminal's invoice number for `DATA_CAP`.
          examples: ["pi_3UFgh0KA7JDnUlfh00eHaTNu"]
        device:
          $ref: "#/components/schemas/ObjectId"
          description: POS terminal — in-store payments only.
        testMode: { type: boolean }
        isSafDecline: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [_id, checkout, business, location, paymentType, amount, status]

    OrderLineItem:
      type: object
      additionalProperties: true
      description: >-
        A line on a placed order. App orders also carry `name` / `cartID`; POS
        orders carry tax breakdowns. Both carry `itemName`.
      properties:
        id: { $ref: "#/components/schemas/ObjectId" }
        _id: { $ref: "#/components/schemas/ObjectId" }
        productID: { $ref: "#/components/schemas/ObjectId" }
        productInventoryID: { $ref: "#/components/schemas/ObjectId" }
        itemName: { type: string }
        name: { type: string }
        price: { type: number, description: Unit price charged }
        originalPrice: { type: number, description: Shelf price before discounts }
        customerSeenPrice: { type: number }
        quantity:
          type: number
          description: Fulfilled quantity — fractional for weighed items.
        requestedQty: { type: number, description: Quantity requested before picking }
        itemTotal: { type: number }
        images: { type: array, items: { $ref: "#/components/schemas/Image" } }
        size: { type: [number, string] }
        unitOfMeasure: { type: string }
        SKU: { type: string }
        upcBarcode: { type: string }
        soldByWeight: { type: boolean }
        taxable: { type: boolean }
        ebtEligible: { type: boolean }
        substitute: { type: [boolean, "null"], description: Whether the shopper allowed substitution }
        substitutedBy:
          type: [object, "null"]
          additionalProperties: true
          description: What the picker swapped in, when substituted.
        comment: { type: [string, "null"] }
        cartID: { $ref: "#/components/schemas/ObjectId" }
        taxesCharged: { type: number }
        taxesExempted: { type: number }
        product:
          $ref: "#/components/schemas/Product"
          description: Full catalog record, denormalized at order time.
      required: [id, _id, productID, productInventoryID, itemName, price, quantity]

    OrdersPage:
      type: object
      description: The signed-in user's orders, as returned by the `GetOrders` GraphQL query.
      properties:
        orders: { type: array, items: { $ref: "#/components/schemas/Order" } }
        totalPages: { type: integer }
        totalResults: { type: integer }
      required: [orders, totalPages, totalResults]

    Order:
      type: object
      additionalProperties: true
      description: >-
        A placed order, as returned by the `GetOrderById` GraphQL query.
        `datePlaced` / `dueDate` are millisecond-epoch strings, not ISO.
        `orderType` here (`local` = app delivery, `inStore` = POS sale) is a
        different vocabulary from the checkout `OrderType`.
      properties:
        _id: { $ref: "#/components/schemas/ObjectId" }
        orderNumber: { type: string, examples: ["15889"] }
        externalID: { type: string, description: Source checkout id }
        business: { $ref: "#/components/schemas/ObjectId" }
        location: { $ref: "#/components/schemas/ObjectId" }
        uid: { type: string, description: Owning user id }
        platform: { type: string, examples: [vendora_split_tender, vendora_pos] }
        status: { type: string, examples: [created, fulfilled] }
        internalStatus: { type: string }
        paymentStatus: { type: string, examples: [paid] }
        fulfillmentStatus: { type: string, examples: [fulfilled] }
        internalFulfillmentStatus: { type: string }
        pickingStatus: { type: string }
        pickingInfo:
          type: array
          items:
            type: object
            properties:
              lineItemProductId: { $ref: "#/components/schemas/ObjectId" }
              cartID: { $ref: "#/components/schemas/ObjectId" }
              pickedQty: { type: number }
              notFoundQty: { type: number }
        orderType: { type: string, examples: [local, inStore] }
        attributes: { type: array, items: { type: string }, examples: [[DELIVERY]] }
        datePlaced: { type: string, description: Millisecond epoch as a string, examples: ["1757703421980"] }
        dueDate: { type: string, description: Millisecond epoch as a string }
        dueASAP: { type: boolean }
        numItems: { type: number, description: Sum of quantities — fractional when weighed items are present }
        lineItems: { type: array, items: { $ref: "#/components/schemas/OrderLineItem" } }
        discounts:
          type: array
          description: Promotions (TPRs, coupons) applied, with per-line applications.
          items: { type: object, additionalProperties: true }
        note: { type: string }
        currency: { type: [string, "null"], examples: [USD] }
        totalPrice: { type: number }
        totalShipping: { type: number }
        totalTax: { type: number }
        totalTip: { type: number }
        shippingAddress:
          allOf:
            - $ref: "#/components/schemas/Address"
            - type: object
              additionalProperties: true
              properties:
                phoneNumber: { type: string }
                selectedRate: { type: string, examples: [Delivery] }
                timeslotText: { type: string, examples: ["ASAP (1.5 hours)"] }
                loyaltyPointsBalance: { type: number, description: POS orders only }
        shipmentInfo: { type: array, items: {} }
        deliveryDetails:
          type: object
          additionalProperties: true
          description: >-
            Nash delivery job (`id`, `status`, `portalUrl`,
            `jobConfigurations[].publicTrackingUrl`, `jobConfigurations[].package`
            with pickup/dropoff locations, `jobConfigurations[].advancedTask.delivery`
            with courier state). Empty object for pickup and POS orders.
        clientDetails:
          type: [object, "null"]
          additionalProperties: true
          properties:
            os: { type: string, examples: [android, ios] }
            appVersion: { type: string }
        testOrder: { type: boolean }
        twillioConversationID: { type: [string, "null"] }
        locationInfo:
          type: object
          properties:
            name: { type: string }
            address: { type: string }
            street2: { type: [string, "null"] }
            city: { type: string }
            state: { type: string }
            zip: { type: string }
            latitude: { type: string }
            longitude: { type: string }
        loyalty:
          type: object
          properties:
            isLoyaltyTransaction: { type: boolean }
            points: { type: number }
      required: [_id, orderNumber, business, location, uid, status, paymentStatus, orderType, datePlaced, lineItems, totalPrice]

    LoyaltyBenefit:
      type: object
      description: A voucher or freebie on a Froogal loyalty account.
      properties:
        platform: { type: string, examples: [FROOGAL] }
        benefitData:
          type: object
          additionalProperties: true
          properties:
            id: { type: integer }
            name: { type: string, examples: ["Free Delivery"] }
            type: { type: string, examples: [voucher] }
            worth: { type: string }
            isPaid: { type: boolean }
            validOutlets: { type: array, items: { type: string } }
            validDays: { type: string, description: Seven flags, Monday-first, examples: ["1111111"] }
            expiryDate: { type: [string, "null"] }
            reusable: { type: boolean }
            image: { type: string, format: uri }
            freebieItem:
              type: object
              additionalProperties: true
              description: The redeemable instance, when one has been issued.

    LoyaltyProfile:
      type: object
      additionalProperties: true
      properties:
        firstName: { type: string }
        lastName: { type: string }
        phoneNumber: { type: string }
        loyaltyAccount:
          type: object
          properties:
            pointsBalance: { type: integer }
            platformSpecificData:
              type: object
              additionalProperties: true
              properties:
                loyaltyId: { type: integer }
                membershipCardNumber: { type: string }
                visits: { type: integer }
                spending: { type: string, description: Lifetime spend, abbreviated, examples: ["11K"] }
                currentYearSpending: { type: string }
                points: { type: integer }
                pointsOnHold: { type: integer }
                currentCardId: { type: integer, description: Matches a loyalty card `id` }
                currentCardSlug: { type: string, examples: [happier-black-monthly] }
                expiry: { type: string, format: date, description: Membership expiry }
                isPaid: { type: boolean }
                autoRenews: { type: integer }
                status: { type: string, examples: [approved] }
                isMember: { type: boolean }
                isEnrolled: { type: boolean }
                isBlocked: { type: boolean }
                enrolledPrograms: { type: array, items: { type: integer } }
                pointsEarned: { type: integer }
                pointsRedeemed: { type: integer }
                currencyConversionRate: { type: string, description: Points per currency unit, examples: ["10.00"] }
          required: [pointsBalance]
        loyaltyTier:
          type: object
          properties:
            uid: { type: integer, description: Matches a loyalty card `uid` }
            pointsRedemptionValue: { type: number, description: Dollar value of one point }
        loyaltyBenefits:
          type: array
          description: Vouchers already on the account.
          items: { $ref: "#/components/schemas/LoyaltyBenefit" }
        availableBenefits:
          type: array
          description: Vouchers the user can claim this period.
          items: { $ref: "#/components/schemas/LoyaltyBenefit" }
        platform: { type: string, examples: [FROOGAL] }
        accountStatus: { type: string, examples: [ACTIVE] }
        customerGroups:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              id: { type: integer }
              customerGroupPublicId: { type: string }
              name: { type: string }
              groupType: { type: string }
              status: { type: string }
      required: [firstName, lastName, loyaltyAccount]

paths:
  /api/v1/business/settings:
    get:
      tags: [business]
      operationId: getBusinessSettings
      summary: Storefront configuration (theme, feature flags, locations)
      security: []
      parameters:
        - name: businessID
          in: query
          required: true
          schema: { $ref: "#/components/schemas/ObjectId" }
      responses:
        "200":
          description: Settings document
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StatusEnvelope"
                  - type: object
                    properties:
                      settings: { type: object, additionalProperties: true }
        "304": { description: Not modified (send `if-none-match`) }

  /api/v1/business/location/deliverySlots:
    post:
      tags: [business]
      operationId: getDeliverySlots
      summary: Fulfillment windows for a location, validated against a cart
      parameters:
        - name: businessLocationID
          in: query
          required: true
          schema: { $ref: "#/components/schemas/ObjectId" }
        - name: validateOffCart
          in: query
          description: Validate each slot against the supplied cart. The app always sends `true`.
          schema: { type: boolean, default: true }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cart:
                  type: array
                  items:
                    type: object
                    properties:
                      productID: { $ref: "#/components/schemas/ObjectId" }
                      id: { $ref: "#/components/schemas/ObjectId" }
                      _id: { $ref: "#/components/schemas/ObjectId" }
      responses:
        "200":
          description: Slots and fulfillment capabilities
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StatusEnvelope"
                  - type: object
                    additionalProperties: true
                    properties:
                      todaysHours:
                        type: object
                        properties:
                          openToday: { type: boolean }
                          openTime: { type: string, format: date-time }
                          closeTime: { type: string, format: date-time }
                      deliveryEnabled: { type: boolean }
                      pickupEnabled: { type: boolean }
                      shippingEnabled: { type: boolean }
                      asapDeliveryEnabled: { type: boolean }
                      asapPickupEnabled: { type: boolean }
                      asapDeliveryOrderPadding: { type: integer, description: Lead-time minutes }
                      asapPickupOrderPadding: { type: integer }
                      deliverySlots:
                        type: array
                        items:
                          type: object
                          properties:
                            friendlyDate: { type: string }
                            dayName: { type: string }
                            beginningOfSlot: { type: string, format: date-time }
                            timeSlots:
                              type: array
                              items: { type: string, examples: ["01:00 PM - 03:00 PM"] }

  /api/v1/products/related:
    get:
      tags: [products]
      operationId: getRelatedProducts
      summary: Related products for a product inventory id
      parameters:
        - name: productID
          in: query
          required: true
          description: A product **inventory** id, despite the name.
          schema: { $ref: "#/components/schemas/ObjectId" }
        - name: numResults
          in: query
          schema: { type: integer, default: 10 }
      responses:
        "200":
          description: Related products
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StatusEnvelope"
                  - type: object
                    properties:
                      relatedProducts:
                        type: array
                        items: { $ref: "#/components/schemas/ProductInventory" }

  /api/v3/public/products/groups/{groupId}/inventory:
    get:
      tags: [products]
      operationId: getProductGroupInventory
      summary: Every product in a merchandising group
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ObjectId" }
        - name: orderType
          in: query
          schema: { $ref: "#/components/schemas/OrderType" }
        - $ref: "#/components/parameters/LocationHeader"
      responses:
        "200":
          description: Group with inventory
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StatusEnvelope"
                  - type: object
                    properties:
                      productGroup:
                        type: object
                        additionalProperties: true
                        properties:
                          _id: { $ref: "#/components/schemas/ObjectId" }
                          name: { type: string }
                          products:
                            type: array
                            items: { $ref: "#/components/schemas/ProductInventory" }

  /api/v2/checkouts:
    post:
      tags: [checkout]
      operationId: createCheckout
      summary: Create a checkout session from a cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                businessLocation: { $ref: "#/components/schemas/ObjectId" }
                orderType: { $ref: "#/components/schemas/OrderType" }
                lineItems:
                  type: array
                  items: { $ref: "#/components/schemas/LineItem" }
              required: [businessLocation, lineItems]
      responses:
        "200":
          description: Checkout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checkout" }

  /api/v2/checkouts/get-taxes:
    post:
      tags: [checkout]
      operationId: getCheckoutTaxes
      summary: Tax due for a checkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                checkoutID: { $ref: "#/components/schemas/ObjectId" }
                shippingAddress: { $ref: "#/components/schemas/Address" }
                contactInfo:
                  type: object
                  properties:
                    email: { type: string, format: email }
