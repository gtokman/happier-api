  /graphql:
    post:
      tags: [graphql]
      operationId: graphql
      summary: GraphQL endpoint
      description: |
        Operations observed: `ProductInventory($productInventoryId: ID!)` for full
        product detail, and `GetOrderById($id: ID!)` for order detail including
        line items. A third, `GetOrders` (no arguments), was found on the schema
        rather than in the capture. All three query strings ship with the package.

        `GetOrderById` returns `{ data: { getOrderById: Order } }` — see
        `#/components/schemas/Order`. It covers in-store POS receipts as well as
        app orders. `GetOrders` returns
        `{ data: { getOrders: { orders: [Order], totalPages, totalResults } } }`
        for the signed-in user — see `#/components/schemas/OrdersPage`.
      parameters:
        - $ref: "#/components/parameters/LocationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                operationName: { type: string }
                query: { type: string }
                variables: { type: object, additionalProperties: true }
              required: [query]
      responses:
        "200":
          description: GraphQL response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: [object, "null"], additionalProperties: true }
                  errors:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        message: { type: string }

  /trpc/{procedures}:
    get:
      tags: [trpc]
      operationId: trpcBatch
      summary: tRPC HTTP batch link
      description: |
        `procedures` is a comma-separated list of procedure names; `input` is a
        JSON object keyed by call index. The response is a positional array of
        `{ result: { data } }` envelopes.

        Procedures observed: `products.getAll`, `products.getFilters`,
        `products.getSubCategories`, `products.getCategoriesWithProducts`,
        `orders.getUserOrderCount`.

        | Procedure | Input | `result.data` |
        | --- | --- | --- |
        | `products.getAll` | `{ searchQuery?, category?, subCategory?, brands?, attributes?, tags?, orderType, useSemanticSearch?, cursor?, direction? }` | `{ products: ProductInventory[], nextPage: int\|null, total, totalPages }` |
        | `products.getFilters` | `{ searchQuery?, category? }` | `{ brands: string[], attributes: string[], tags: string[] }` |
        | `products.getSubCategories` | `{ category }` (category `identifier`) | `ProductSubCategory[]` |
        | `products.getCategoriesWithProducts` | `{ department, locationID, orderType }` | `{ categories: (ProductCategory & { products: CategoryProduct[] })[] }` |
        | `orders.getUserOrderCount` | `{ fromDate: ISO-8601 }` | `integer` |

        Example:

        ```
        GET /trpc/products.getFilters,products.getAll?batch=1
            &input={"0":{"searchQuery":"Sardines"},
                    "1":{"searchQuery":"Sardines","orderType":"PICKUP","useSemanticSearch":true}}
        ```
      parameters:
        - name: procedures
          in: path
          required: true
          schema: { type: string, examples: ["products.getFilters,products.getAll"] }
        - name: batch
          in: query
          required: true
          schema: { type: integer, enum: [1] }
        - name: input
          in: query
          required: true
          description: JSON object keyed by call index.
          schema: { type: string }
        - $ref: "#/components/parameters/LocationHeader"
      responses:
        "200":
          description: Positional array of tRPC result envelopes
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    result:
                      type: object
                      properties:
                        data: {}
                    error:
                      type: object
                      additionalProperties: true
